name: .NET Core Test Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Matches your SDK version

    - name: Restore dependencies
      run: dotnet restore backend/RaceDay.Api/RaceDay.Api.slnx

    - name: Build
      run: dotnet build backend/RaceDay.Api/RaceDay.Api.slnx --no-restore

    - name: Run Tests
      run: dotnet test backend/RaceDay.Api/RaceDay.Api.slnx --no-build --verbosity normal
